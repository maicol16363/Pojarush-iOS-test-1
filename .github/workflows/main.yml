name: ios-check
on: workflow_dispatch
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iOS-port-test
      - name: Ver arboard
        run: |
          echo "=== Cargo.toml de horizon-client-input ==="
          cat horizon/crates/horizon-client-input/Cargo.toml
          echo "=== usos de arboard ==="
          grep -rn "arboard" horizon/crates --include=*.rs --include=Cargo.toml || true
          echo "=== usos de clipboard ==="
          grep -rn -i "clipboard" horizon/crates --include=*.rs | head -60 || true
