name: ios-check
on: workflow_dispatch
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iOS-port-test
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Ver horizon-hdr
        run: |
          cat horizon/crates/horizon-hdr/Cargo.toml
          head -150 horizon/crates/horizon-hdr/src/lib.rs
      - name: Check iOS (todos los errores)
        working-directory: horizon
        continue-on-error: true
        run: cargo check --keep-going --target aarch64-apple-ios -p horizon-client
