name: ios-check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iOS-port-test
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Parche keybinds
        run: |
          f=horizon/crates/horizon-client-input/src/keybinds.rs
          sed -i '' '/target_os = "ios"/!s/target_os = "android"/any(target_os = "android", target_os = "ios")/g' "$f"
          git diff
          git config user.name "ios-port-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "iOS: learn_layout vacio como en Android"
          git push origin HEAD:iOS-port-test
      - name: Check iOS build
        working-directory: horizon
        run: cargo check --target aarch64-apple-ios -p horizon-client
