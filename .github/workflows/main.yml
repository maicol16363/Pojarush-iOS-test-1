name: ios-check
on: workflow_dispatch
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iOS-port-test
      - name: Ver keybinds y usos de android
        run: |
          echo "=== keybinds.rs lineas 270-330 ==="
          sed -n '270,330p' horizon/crates/horizon-client-input/src/keybinds.rs
          echo "=== android en horizon-client-input ==="
          grep -rn 'android' horizon/crates/horizon-client-input --include=*.rs
          echo "=== todos los cfg android del proyecto ==="
          grep -rn 'target_os = "android"' horizon/crates --include=*.rs --include=Cargo.toml | cut -c1-170
